# Lab 1 - The SAME small web app sits behind all three "doors".
#
# whereami is a tiny Google sample app. It answers every HTTP request with JSON
# that tells you WHICH Pod, node, zone and cluster served the request.
#   - GET /healthz   -> "OK"            (used as a health check)
#   - GET /metadata  -> value of $METADATA (handy for quick tests)
#   - GET /anything  -> full JSON payload
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: lab1-three-doors
spec:
  replicas: 2                      # run 2 copies (Pods) of the app
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello                 # Services find these Pods by this label
    spec:
      containers:
      - name: whereami
        image: us-docker.pkg.dev/google-samples/containers/gke/whereami:v1.2.28
        ports:
        - containerPort: 8080      # the app listens on 8080 inside the Pod
        env:
        - name: METADATA
          value: "hello (lab1-three-doors)"
        - name: ECHO_HEADERS       # echo request headers back in the JSON
          value: "True"
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        readinessProbe:            # only send traffic to the Pod when /healthz returns 200
          httpGet:
            path: /healthz
            port: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
---
# ClusterIP Service = a stable, INTERNAL-ONLY name + virtual IP in front of the Pods.
# It is not reachable from the internet by itself.
# Door 2 (Ingress) and Door 3 (Gateway) both point to this same Service, which is
# also exactly how a safe Ingress -> Gateway migration works (run both side by side).
apiVersion: v1
kind: Service
metadata:
  name: hello-svc
  namespace: lab1-three-doors
  annotations:
    # Container-native load balancing: the load balancer sends traffic straight
    # to Pod IPs (via a Network Endpoint Group, NEG) instead of to nodes.
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: hello
  ports:
  - name: http
    port: 80                       # port of the Service
    targetPort: 8080               # port of the container
