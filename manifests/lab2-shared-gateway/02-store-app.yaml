# Lab 2 - "store" team app: two versions of the same app (v1 = stable, v2 = canary).
# Each version has 1 Pod only. With Gateway API the traffic split (90/10) is set
# on the HTTPRoute, so it does NOT depend on how many Pods each version has.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-v1
  namespace: store-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store
      version: v1
  template:
    metadata:
      labels:
        app: store
        version: v1
    spec:
      containers:
      - name: whereami
        image: us-docker.pkg.dev/google-samples/containers/gke/whereami:v1.2.28
        ports:
        - containerPort: 8080
        env:
        - name: METADATA
          value: "store-v1"
        - name: ECHO_HEADERS
          value: "True"
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-v2
  namespace: store-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store
      version: v2
  template:
    metadata:
      labels:
        app: store
        version: v2
    spec:
      containers:
      - name: whereami
        image: us-docker.pkg.dev/google-samples/containers/gke/whereami:v1.2.28
        ports:
        - containerPort: 8080
        env:
        - name: METADATA
          value: "store-v2"
        - name: ECHO_HEADERS
          value: "True"
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: store-v1
  namespace: store-ns
spec:
  selector:
    app: store
    version: v1
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: store-v2
  namespace: store-ns
spec:
  selector:
    app: store
    version: v2
  ports:
  - name: http
    port: 8080
    targetPort: 8080
