# Lab 2 - HTTPRoute owned by the "site" team (in site-ns), attached to the SAME
# shared Gateway. Two teams, two namespaces, one load balancer, one IP.
#
# Shows:
#   1. Host-based routing (site.example.com)
#   2. HTTP redirect done by the load balancer itself (no app code needed)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site-route
  namespace: site-ns
spec:
  parentRefs:
  - name: shared-ext-gw
    namespace: infra-ns
    sectionName: http
  hostnames:
  - "site.example.com"
  rules:
  # Rule 1 - old links: /old-blog/... -> HTTP 301 redirect to /blog/...
  - matches:
    - path:
        type: PathPrefix
        value: /old-blog
    filters:
    - type: RequestRedirect
      requestRedirect:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /blog
        statusCode: 301
  # Rule 2 - everything else goes to the site app.
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: site
      port: 8080
